<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acil Araç GPS Takip</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{font-family:system-ui,Arial,sans-serif;color:#172538;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#142a42;color:white;padding:18px 20px}header h1{font-size:21px;margin:0}header small{color:#cbd5e1}main{max-width:1000px;margin:auto;padding:16px}.panel{background:white;border:1px solid #e0e6ee;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 7px #152a4510}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}input,select,button{width:100%;padding:12px;border:1px solid #bdc9d8;border-radius:9px;font:inherit}button{background:#1e60c6;color:white;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button.secondary{background:#e7eef7;color:#1e3856}#map{height:410px;border-radius:12px;background:#dfe7ef}.status{padding:12px;border-radius:9px;background:#e9f1fb;margin-top:12px}.warn{background:#fff1df;color:#713d06}.danger{background:#ffe6e6;color:#8b1616}.good{background:#e4f5e9;color:#18572c}.vehicle{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #e4e8ee}.vehicle:last-child{border:0}.muted{color:#64748b;font-size:13px}.pill{font-size:12px;background:#e9eff9;padding:5px 9px;border-radius:20px}.note{font-size:13px;color:#566579;line-height:1.5}.actions{display:flex;gap:10px;margin-top:12px}.actions button{flex:1}.emoji{font-size:22px}.row{display:flex;align-items:center;gap:8px}#alerts{font-weight:700}@media(max-width:600px){.controls{grid-template-columns:1fr}#map{height:330px}}</style></head><body><header><h1>🚨 Acil Araç GPS Takip</h1></header><main><section class="panel"><div class="controls"><div><label for="mode">Giriş türü</label><select id="mode"><option value="driver">🚙 Normal sürücü</option><option value="emergency">🚨 Acil araç</option></select></div><div id="emergencyFields" style="display:none"><label for="type">Acil araç türü</label><select id="type"><option value="ambulance">🚑 Ambulans</option><option value="police">🚓 Polis</option><option value="fire">🚒 İtfaiye</option></select><label for="accessCode" style="margin-top:10px">Giriş kodu</label><input id="accessCode" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="Giriş kodu"></div></div><div class="actions"><button id="start">Konum paylaşımını başlat</button><button id="stop" class="secondary" disabled>Paylaşımı durdur</button></div><div id="status" class="status">Hazır.</div></section><section class="panel"><div class="row" style="justify-content:space-between"><strong>Canlı harita</strong><span id="count" class="pill">0 araç</span></div><div id="map" style="margin-top:12px"></div><div class="actions"><button id="soundToggle" class="secondary" type="button">🔇 Sesli uyarıyı aç</button></div><div id="alerts" class="status">Henüz konum verisi yok.</div></section><section class="panel"><strong>Aktif acil araçlar</strong><div id="vehicles" class="muted" style="margin-top:10px">Henüz bağlantı yok.</div></section><section class="panel"><strong>GPS test bilgileri</strong><div id="debug" class="muted" style="margin-top:10px;white-space:pre-wrap;font-family:monospace">Başlatılmadı.</div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module">

const app=initializeApp(config),auth=getAuth(app),db=getDatabase(app);const $=id=>document.getElementById(id);const ROOM='OrtakTest2026',TEST_CODE='123456';let uid=null,watchId=null,unsub=null,myRef=null,me=null,started=false,latest={},lastDriverPosition=null,driverBearing=null,firstFix=true,heartbeatTimer=null,renderTimer=null,lastGpsAt=0,lastAccuracy=null,writing=false;const map=L.map('map').setView([39.93,32.86],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);let markers={};const emoji={driver:'🚙',ambulance:'🚑',police:'🚓',fire:'🚒'},names={driver:'Sürücü',ambulance:'Ambulans',police:'Polis',fire:'İtfaiye'};
function status(s,cls=''){ $('status').textContent=s;$('status').className='status '+cls}function isDriver(){return $('mode').value==='driver'}function currentType(){return isDriver()?'driver':$('type').value}function updateMode(){$('emergencyFields').style.display=isDriver()?'none':'block'}$('mode').addEventListener('change',updateMode);updateMode();function validCoords(p){return p&&Number.isFinite(p.lat)&&Number.isFinite(p.lng)&&Math.abs(p.lat)<=90&&Math.abs(p.lng)<=180}function distance(a,b){if(!validCoords(a)||!validCoords(b))return null;const r=6371000,rad=x=>x*Math.PI/180,dlat=rad*(b.lat-a.lat),dlng=rad*(b.lng-a.lng),x=Math.sin(dlat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dlng/2)**2;const result=2*r*Math.atan2(Math.sqrt(Math.max(0,x)),Math.sqrt(Math.max(0,1-x)));return Number.isFinite(result)?result:null}function bearing(a,b){if(!validCoords(a)||!validCoords(b))return null;const r=x=>x*Math.PI/180,y=Math.sin(r(b.lng-a.lng))*Math.cos(r(b.lat)),x=Math.cos(r(a.lat))*Math.sin(r(b.lat))-Math.sin(r(a.lat))*Math.cos(r(b.lat))*Math.cos(r(b.lng-a.lng));return (Math.atan2(y,x)*180/Math.PI+360)%360}function relDirection(a,b){const targetBearing=bearing(a,b);if(!Number.isFinite(driverBearing)||!Number.isFinite(targetBearing))return 'Yön belirlenemedi';const angle=(targetBearing-driverBearing+360)%360;return angle<45||angle>=315?'Önde':angle<135?'Sağda':angle<225?'Arkada':'Solda'}function fresh(v){return Number.isFinite(v.updatedAt)&&Date.now()-v.updatedAt<60000&&v.updatedAt<Date.now()+15000}function recent(v){return Number.isFinite(v.updatedAt)&&Date.now()-v.updatedAt<300000&&v.updatedAt<Date.now()+15000}async function publishLocation(){if(!started||!myRef||!validCoords(me)||writing||Date.now()-lastGpsAt>60000)return;writing=true;try{await set(myRef,{type:currentType(),lat:me.lat,lng:me.lng,updatedAt:serverTimestamp()})}catch(e){status('Konum kaydı başarısız: '+e.message,'danger')}finally{writing=false}}let audioContext=null,soundEnabled=false,lastAlertLevel=0,lastAlertAt=0;let gpsRetryAt=0;
$('soundToggle').addEventListener('click',async()=>{
 if(!soundEnabled){
  try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error('Ses desteklenmiyor');audioContext=audioContext||new AC();await audioContext.resume();soundEnabled=true;$('soundToggle').textContent='🔊 Sesli uyarı açık';}
  catch(e){status('Ses etkinleştirilemedi: '+e.message,'danger');}
 }else{soundEnabled=false;lastAlertLevel=0;$('soundToggle').textContent='🔇 Sesli uyarıyı aç';}
});
function playWarning(level){
 if(!soundEnabled||!audioContext||audioContext.state!=='running')return;
 const t=audioContext.currentTime;
 const tones=level===3?[880,880,880]:level===2?[740,740]:[600];
 tones.forEach((hz,i)=>{const start=t+i*.27,osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type='sine';osc.frequency.value=hz;gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.12,start+.025);gain.gain.exponentialRampToValueAtTime(.0001,start+.20);osc.connect(gain);gain.connect(audioContext.destination);osc.start(start);osc.stop(start+.21)});
}
function updateSound(level){
 if(!started||!isDriver()||!soundEnabled){lastAlertLevel=0;return;}
 if(level===0){lastAlertLevel=0;return;}
 const now=Date.now();
 if(level>lastAlertLevel||(level!==lastAlertLevel&&now-lastAlertAt>15000)||(level===lastAlertLevel&&now-lastAlertAt>45000)){
  playWarning(level);lastAlertAt=now;

 lastAlertLevel=level;
}
function render(){
 const records=Object.entries(latest).filter(([id,v])=>v&&v.type!=='driver'&&validCoords(v)&&recent(v));
 const active=records.filter(([id,v])=>fresh(v));
 $('count').textContent=active.length+' aktif acil araç';
 const ids=new Set(records.map(([id])=>id));
 if(validCoords(me)&&isDriver())ids.add('__self');
 for(const id of Object.keys(markers)){if(!ids.has(id)){map.removeLayer(markers[id]);delete markers[id]}}
 if(validCoords(me)&&isDriver()){
  const selfIcon=L.divIcon({html:'<div style="font-size:26px">🚙</div>',className:'',iconSize:[32,32],iconAnchor:[16,16]});
  if(markers.__self)markers.__self.setLatLng([me.lat,me.lng]);else markers.__self=L.marker([me.lat,me.lng],{icon:selfIcon}).addTo(map);
  markers.__self.bindPopup('Siz (sürücü)');
 }
 for(const [id,v] of records){
  const live=fresh(v);
  const icon=L.divIcon({html:`<div style="font-size:26px;opacity:${live?1:.4};text-shadow:0 1px 4px white">${emoji[v.type]||'📍'}</div>`,className:'',iconSize:[32,32],iconAnchor:[16,16]});
  if(markers[id])markers[id].setLatLng([v.lat,v.lng]).setIcon(icon);else markers[id]=L.marker([v.lat,v.lng],{icon}).addTo(map);
  markers[id].bindPopup(`${names[v.type]||'Cihaz'}${id===uid?' (Siz)':''}${live?'':' · Son konum (güncel değil)'}`);
 }
 const others=records.filter(([id])=>id!==uid).map(([id,v])=>({id,v,live:fresh(v),meters:validCoords(me)?distance(me,v):null})).sort((a,b)=>Number(b.live)-Number(a.live)||(a.meters??Infinity)-(b.meters??Infinity));
 $('vehicles').replaceChildren();
 if(!others.length)$('vehicles').textContent='Aktif acil araç henüz görünmüyor.';
 for(const x of others){
  const row=document.createElement('div');row.className='vehicle';
  const left=document.createElement('div'),right=document.createElement('div');
  left.textContent=(emoji[x.v.type]||'📍')+' '+(names[x.v.type]||'Cihaz')+(x.live?'':' · Son konum (güncel değil)');
  right.textContent=!x.live?'Canlı mesafe yok':!Number.isFinite(x.meters)?(!validCoords(me)?'Sürücü GPS konumu bekleniyor':'Mesafe hesaplama hatası'):Math.round(x.meters)+' m · '+(isDriver()?relDirection(me,x.v):'Mesafe');
  row.append(left,right);$('vehicles').append(row);
 }
 const ownValid=Boolean(validCoords(me));
 const dbg=others.map(x=>{const targetValid=Boolean(validCoords(x.v));const calc=ownValid&&targetValid?distance(me,x.v):null;return `${names[x.v.type]||'Araç'}: koordinat ${targetValid?'geçerli':'GEÇERSİZ'} (${String(x.v.lat)}, ${String(x.v.lng)}); kayıt ${x.live?'güncel':'eski'}; mesafe ${Number.isFinite(calc)?calc.toFixed(1)+' m':'HESAPLANAMADI'}`});
 $('debug').textContent=`Mod: ${isDriver()?'Sürücü':'Acil araç'}\nSürücü GPS: ${ownValid?'geçerli':'GEÇERSİZ'} (${me?String(me.lat)+', '+String(me.lng):'henüz yok'})\nGPS yaşı: ${lastGpsAt?Math.round((Date.now()-lastGpsAt)/1000)+' saniye':'bilinmiyor'}\nFirebase araç sayısı: ${records.length}\n${dbg.join('\n')||'Henüz araç yok'}`;

 else if(lastGpsAt&&Date.now()-lastGpsAt>60000){alert.className='status warn';alert.textContent='Kendi GPS konumunuz güncel değil; yeni konum bekleniyor.'}
 else if(!isDriver()){alert.className='status good';alert.textContent='Acil araç konumunuz paylaşılıyor. Yakınlık uyarıları normal sürücü ekranında gösterilir.'}
 else if(nearby.length){alert.className=level>=2?'status danger':'status warn';alert.textContent=`${level===3?'KRİTİK YAKINLIK! ':level===2?'DİKKAT! ':''}${nearby.length} acil araç 500 m içinde. En yakın: ${names[nearby[0].v.type]}, ${Math.round(nearby[0].meters)} m, ${isDriver()?relDirection(me,nearby[0].v):'yön bilgisi sürücü modunda'}.`}
 else if(others.some(x=>x.live&&!Number.isFinite(x.meters))){alert.className='status warn';alert.textContent='Mesafe hesaplanamadı; GPS koordinatları yeniden kontrol ediliyor.'}
 else if(others.some(x=>!x.live)){alert.className='status warn';alert.textContent='Bazı acil araçların yalnızca eski konumu mevcut; canlı yakınlık uyarısı verilmez.'}
 else{alert.className='status good';alert.textContent='500 m içinde görünen aktif acil araç yok.'}
}
async function start(){if(started)return;if(!isDriver()&&$('accessCode').value!==TEST_CODE){status('Acil araç giriş kodu hatalı.','danger');return}if(!navigator.geolocation){status('Bu tarayıcı konum hizmetini desteklemiyor.','danger');return}if(!window.isSecureContext){status('GPS için HTTPS üzerinden açmalısınız.','danger');return}$('start').disabled=true;status('Firebase bağlantısı kuruluyor...');try{if(!auth.currentUser)await signInAnonymously(auth);uid=auth.currentUser.uid;myRef=isDriver()?null:ref(db,`rooms/${ROOM}/${uid}`);if(myRef)await onDisconnect(myRef).remove();unsub=onValue(ref(db,`rooms/${ROOM}`),s=>{latest=s.val()||{};render()},e=>status('Veritabanı okuma hatası: '+e.message,'danger'));started=true;renderTimer=setInterval(()=>{render();if(started&&isDriver()&&document.visibilityState==='visible'&&Date.now()-lastGpsAt>15000&&Date.now()-gpsRetryAt>15000){gpsRetryAt=Date.now();navigator.geolocation.getCurrentPosition(p=>{const pos={lat:p.coords.latitude,lng:p.coords.longitude};if(!validCoords(pos))return;me=pos;lastGpsAt=Date.now();lastAccuracy=p.coords.accuracy;render()},()=>{},{enableHighAccuracy:true,maximumAge:0,timeout:12000})}},5000);heartbeatTimer=setInterval(publishLocation,10000);$('stop').disabled=false;$('mode').disabled=true;$('type').disabled=true;$('accessCode').disabled=true;watchId=navigator.geolocation.watchPosition(async p=>{const pos={lat:p.coords.latitude,lng:p.coords.longitude};if(!validCoords(pos)){status('GPS geçersiz koordinat döndürdü; yeni konum bekleniyor.','danger');return}const moved=validCoords(me)?distance(me,pos):null;if(Number.isFinite(moved)&&moved>Math.max(8,(Number.isFinite(p.coords.accuracy)?p.coords.accuracy:0))&&isDriver())driverBearing=bearing(me,pos);me=pos;lastGpsAt=Date.now();lastAccuracy=p.coords.accuracy;try{await publishLocation();status(`GPS etkin · doğruluk yaklaşık ${Number.isFinite(p.coords.accuracy)?Math.round(p.coords.accuracy)+' m':'bilinmiyor'}`,'good');if(firstFix){map.setView([pos.lat,pos.lng],16);f async function stop(){if(heartbeatTimer!==null){clearInterval(heartbeatTimer);heartbeatTimer=null}if(renderTimer!==null){clearInterval(renderTimer);renderTimer=null}if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}if(unsub){unsub();unsub=null}if(myRef){try{await remove(myRef);await onDisconnect(myRef).cancel()}catch(e){status('Kaydı kaldırma hatası: '+e.message,'danger')}}myRef=null;started=false;lastAlertLevel=0;me=null;driverBearing=null;latest={};firstFix=true;lastGpsAt=0;$('mode').disabled=false;$('type').disabled=false;$('accessCode').disabled=false;$('start').disabled=false;$('stop').disabled=true;render();status('Konum paylaşımı durduruldu.')} $('start').addEventListener('click',start);$('stop').addEventListener('click',stop);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&started&&Date.now()-lastGpsAt>10000){navigator.geolocation.getCurrentPosition(p=>{const pos={lat:p.coords.latitude,lng:p.coords.longitude};if(!validCoords(pos))return;me=pos;lastGpsAt=Date.now();lastAccuracy=p.coords.accuracy;if(firstFix){map.setView([pos.lat,pos.lng],16);firstFix=false}publishLocation();render();status('GPS yeniden güncellendi · doğruluk yaklaşık '+Math.round(p.coords.accuracy)+' m','good')},e=>status('GPS yeniden alınamadı: '+e.message,'danger'),{enableHighAccuracy:true,maximumAge:0,timeout:20000})}});onAuthStateChanged(auth,u=>{if(u)uid=u.uid});
